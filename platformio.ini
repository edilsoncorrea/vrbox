;
; ========================================================================
; VRBOX ESP32-C3 BLE Client - Configuração PlatformIO
; ========================================================================
; 
; Projeto: Cliente BLE para joystick VRBOX
; Hardware: ESP32-C3-DevKitM-1 (testado e validado)
; Framework: Arduino + ESP32 BLE Library
; 
; Status: ✅ FUNCIONANDO PERFEITAMENTE
; RAM Usage: 11.9% (38,844 bytes)
; Flash Usage: 74.9% (982,342 bytes)
; 
; Funcionalidades:
; - BLE Client com discovery automático
; - Parsing específico VRBOX (4-byte e 2-byte)
; - Comandos de ativação PS3/BigJBehr
; - Reconexão automática
; - Debug via USB Serial
; ========================================================================

[env:esp32-c3-devkitm-1]
; ========================================================================
; CONFIGURAÇÃO BÁSICA DO HARDWARE
; ========================================================================
platform = espressif32          ; Plataforma Espressif ESP32
board = esp32-c3-devkitm-1      ; Placa específica ESP32-C3-DevKitM-1
framework = arduino             ; Framework Arduino para compatibilidade
monitor_speed = 115200          ; Velocidade do monitor serial

; ========================================================================
; CONFIGURAÇÕES BLE E USB
; ========================================================================
build_flags = 
    ; USB Configuration para ESP32-C3
    -DARDUINO_USB_MODE=1           ; Habilitar modo USB nativo
    -DARDUINO_USB_CDC_ON_BOOT=1    ; CDC USB ativo no boot (Serial via USB)
    
    ; Bluetooth Configuration
    -DCONFIG_BT_ENABLED=1          ; Habilitar stack Bluetooth
    -DCONFIG_BLUEDROID_ENABLED=1   ; Habilitar Bluedroid (BLE + Classic)
    
    ; Debug e Performance
    -DCORE_DEBUG_LEVEL=3           ; Nível de debug (0=None, 5=Verbose)
    -DCONFIG_ARDUHAL_LOG_COLORS=1  ; Cores no output serial

; ========================================================================
; CONFIGURAÇÕES DO MONITOR SERIAL
; ========================================================================
monitor_filters = 
    esp32_exception_decoder        ; Decodificar stack traces automaticamente
    time                          ; Timestamp nas mensagens
    ; colorize                    ; Colorir output (opcional)
    ; log2file                    ; Salvar log em arquivo (opcional)

; ========================================================================
; CONFIGURAÇÕES AVANÇADAS (OPCIONAIS)
; ========================================================================

; Configuração de memória (descomente se necessário)
; board_build.partitions = default.csv  ; Particionamento padrão
; board_build.filesystem = spiffs       ; Sistema de arquivos

; Configurações de upload (descomente se necessário)  
; upload_protocol = esptool             ; Protocolo de upload
; upload_speed = 921600                 ; Velocidade de upload

; Dependências da biblioteca (já incluídas no ESP32 core)
; lib_deps = 
;     ESP32 BLE Arduino              ; Biblioteca BLE (já incluída)

; ========================================================================
; COMANDOS ÚTEIS
; ========================================================================
;
; Compilar:                  pio run
; Upload:                    pio run --target upload
; Monitor:                   pio device monitor
; Limpar:                    pio run --target clean
; Upload + Monitor:          pio run -t upload -t monitor
; Listar dispositivos:       pio device list
; Especificar porta:         pio run --target upload --upload-port COM5
;
; ========================================================================