# Configurações alternativas para platformio.ini

# =============================================================================
# Configuração para ESP32-C3 com máxima performance
# =============================================================================

[env:esp32-c3-performance]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

# Otimizações de performance
build_flags = 
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BT_HID_ENABLED=1
    -DCORE_DEBUG_LEVEL=1
    -O3
    -DCONFIG_FREERTOS_HZ=1000
    
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L

# =============================================================================
# Configuração para debug intensivo
# =============================================================================

[env:esp32-c3-debug]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BT_HID_ENABLED=1
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_BLUETOOTH=1
    -g
    -Og

debug_tool = esp-prog
debug_init_break = tbreak setup

# =============================================================================
# Configuração BLE only (sem Bluetooth Classic)
# =============================================================================

[env:esp32-c3-ble]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DCONFIG_BT_CLASSIC_ENABLED=0
    -DCONFIG_BT_HID_ENABLED=1
    -DUSE_BLE_ONLY=1

lib_deps = 
    ESP32-BLE-Arduino

# =============================================================================
# Configuração com WiFi + Bluetooth
# =============================================================================

[env:esp32-c3-wifi-bt]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BT_HID_ENABLED=1
    -DWIFI_ENABLED=1

lib_deps = 
    ESP32-BLE-Arduino
    WiFi
    ESPAsyncWebServer
    ArduinoJson

# =============================================================================
# Configuração com bibliotecas adicionais para controle
# =============================================================================

[env:esp32-c3-complete]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BT_HID_ENABLED=1

lib_deps = 
